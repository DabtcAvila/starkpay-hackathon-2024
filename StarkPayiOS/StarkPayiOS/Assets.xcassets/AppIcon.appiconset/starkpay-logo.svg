<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium Gradient Background -->
  <defs>
    <radialGradient id="bgGradient" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    
    <linearGradient id="lightningGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="512" cy="512" r="480" fill="url(#bgGradient)" stroke="#333" stroke-width="8"/>
  
  <!-- Main Lightning Bolt Symbol -->
  <g transform="translate(512, 512)">
    <!-- Lightning bolt shape -->
    <path d="M-80 -120 L60 -20 L-20 -20 L80 120 L-60 20 L20 20 Z" 
          fill="url(#lightningGradient)" 
          filter="url(#glow)"
          stroke="#FFD700" 
          stroke-width="3"/>
    
    <!-- Inner highlight -->
    <path d="M-60 -100 L40 -10 L-10 -10 L60 100 L-40 10 L10 10 Z" 
          fill="#FFFFFF" 
          opacity="0.3"/>
  </g>
  
  <!-- Elegant "S" for StarkPay -->
  <g transform="translate(512, 380)">
    <path d="M-60 -40 Q-60 -60 -40 -60 L40 -60 Q60 -60 60 -40 Q60 -20 40 -20 L-20 -20 Q-40 -20 -40 0 Q-40 20 -20 20 L40 20 Q60 20 60 40 Q60 60 40 60 L-40 60 Q-60 60 -60 40" 
          fill="url(#lightningGradient)" 
          stroke="#FFD700" 
          stroke-width="2"/>
  </g>
  
  <!-- Subtle "P" for Pay -->
  <g transform="translate(512, 650)">
    <path d="M-60 -40 L-60 40 M-60 -40 L20 -40 Q40 -40 40 -20 Q40 0 20 0 L-60 0" 
          fill="none" 
          stroke="url(#lightningGradient)" 
          stroke-width="8" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Premium dots pattern -->
  <g opacity="0.2">
    <circle cx="200" cy="200" r="3" fill="#FFD700"/>
    <circle cx="824" cy="200" r="3" fill="#FFD700"/>
    <circle cx="200" cy="824" r="3" fill="#FFD700"/>
    <circle cx="824" cy="824" r="3" fill="#FFD700"/>
  </g>
</svg>