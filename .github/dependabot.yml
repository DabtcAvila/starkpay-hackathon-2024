version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "@devops-team"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # Swift Package Manager dependencies
  - package-ecosystem: "swift"
    directory: "/StarkPayiOS"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
    open-pull-requests-limit: 5
    reviewers:
      - "@ios-team"
      - "@security-team"
    labels:
      - "dependencies"
      - "swift"
      - "security"
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
      include: "scope"
    # Only allow security updates for production dependencies
    allow:
      - dependency-type: "direct"
        update-type: "security"
      - dependency-type: "indirect"
        update-type: "security"